# NOTE: Node.js 20 deprecation warnings are from upstream actions.
# Update action versions when newer releases drop Node 20.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Build
        run: dotnet build Unswarm.slnx
        working-directory: backend
      - name: Test
        run: dotnet test --no-build
        working-directory: backend
        timeout-minutes: 10

  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: agent
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: agent
      - name: Test
        run: go test -race ./...
        working-directory: agent

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      - name: Test
        run: pnpm test
        working-directory: frontend
        timeout-minutes: 10
      - name: Build
        run: pnpm build
        working-directory: frontend

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: cli
      - name: Test
        run: go test ./...
        working-directory: cli

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile .
      - run: docker build ./agent
