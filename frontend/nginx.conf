server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers for SPA static responses ────────────────────────────
    # CSP notes:
    #  - index.html ships exactly ONE inline <script> (FOUC theme resolution).
    #    It is pinned by its sha256 hash so script-src stays 'self' + that
    #    single block — no script 'unsafe-inline'. If you edit the inline
    #    script in index.html, recompute the hash:
    #      python3 -c "import re,hashlib,base64;h=open('frontend/dist/index.html').read();s=re.search(r'<script>(.*?)</script>',h,re.S).group(1);print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
    #  - style-src keeps 'unsafe-inline': the app sets style="" attributes at
    #    runtime (React inline styles), which CSP only allows via unsafe-inline.
    #  - Google Fonts (fonts.googleapis.com / fonts.gstatic.com) are loaded by
    #    index.html, hence the explicit style-src/font-src entries.
    # NOTE: nginx only inherits add_header into a location when that location
    # defines NO add_header of its own; /assets/ sets Cache-Control, so the
    # headers are repeated there explicitly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-1+DROQAKTZlEcPm7GPp54//iskyUpZgoetwc1Q+oHiM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Static assets: immutable hashed filenames
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-1+DROQAKTZlEcPm7GPp54//iskyUpZgoetwc1Q+oHiM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend API
    location /api/ {
        proxy_pass http://backend:5014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://backend:5014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:5014;
        proxy_set_header Host $host;
    }

    # WebSocket (browser dashboard)
    location /ws/ {
        proxy_pass http://backend:5014;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
