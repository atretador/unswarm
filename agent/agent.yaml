# Unswarm Agent Configuration
# Copy this file and modify as needed.

# Backend WebSocket URL (supports ws://, wss://, http://, https://)
# For any non-local deployment, use wss:// to encrypt the API key in transit.
#
# Precedence: a non-empty value here wins. If this field is empty, the agent
# falls back to the UNSWARM_AGENT_BACKEND_URL environment variable.
backend_url: "ws://localhost:5014"

# API key for authentication (empty = no auth)
#
# Precedence: a non-empty value here wins. If this field is empty, the agent
# falls back to the UNSWARM_AGENT_API_KEY environment variable.
api_key: ""

# Unique agent name — must be unique across all agents on the same backend
agent_name: "machine-b"

# Docker socket path
docker_socket: "unix:///var/run/docker.sock"

# Allow unencrypted ws:// connections to non-loopback hosts.
# Default false: the agent will refuse ws:// to a remote host to prevent
# the API key from being sent in plaintext. Set to true only if you accept
# the risk (e.g. a dedicated, isolated network with no MITM threat).
allow_insecure_ws: false

# Reconnection settings
reconnect:
  initial_backoff_ms: 1000    # 1 second
  max_backoff_ms: 30000       # 30 seconds
  max_retries: -1             # -1 = infinite retries
