name: unswarm

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "22301:5014"
    volumes:
      # Persistent app data: SQLite DB + DataProtection key ring
      # ($HOME=/data → /data/.config/unswarm/unswarm.db and .../keys).
      # Keeping the key ring here means API-key ciphertexts stay decryptable
      # across container recreation.
      - unswarm-data:/data
      # Docker socket: backend queries the daemon for container stats / lifecycle
      - /var/run/docker.sock:/var/run/docker.sock
      # Host scripts directory: launcher scripts (.sh) managed via the API.
      # Maps the host's script directory into the container at /data/scripts.
      - ${HOST_SCRIPTS_DIR:-~/.config/unswarm/scripts}:/data/scripts
    group_add:
      - "${DOCKER_GID:-999}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Static API key seeded into the managed key store at startup (agent scope).
      # Leave empty to skip; generate a key via the dashboard instead.
      UNSWARM_API_KEY: ${UNSWARM_API_KEY:-}
      # Container host address — host.docker.internal routes to the Docker host
      # so the backend can reach model-container ports mapped to the host.
      ContainerHost__Host: ${ContainerHost__Host:-host.docker.internal}
      # Optional: bootstrap/reset the admin password on first run
      # UNSWARM_ADMIN_PASSWORD: ${UNSWARM_ADMIN_PASSWORD:-}
      # Signals that the backend is running inside Docker.
      # Gates features that require bare-metal host access (e.g. host script execution).
      RUNNING_IN_DOCKER: "true"
      # CORS origins for browser access if not same-origin
      # Cors__AllowedOrigins: https://unswarm.example.com
      # Host scripts directory path inside the container (matches the bind mount above).
      HostScripts__Directory: /data/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5014/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Optional: run an agent inside this compose network ────────────────────
  # In production, agents typically run on REMOTE hosts with access to that
  # host's Docker daemon — prefer a bare-metal install (see deploy/README.md).
  # Only use this profile for a local all-in-one stack:
  #
  #   docker compose --profile agent up -d
  #
  # The agent needs the host Docker socket to manage model containers.
  agent:
    build: ./agent
    profiles: ["agent"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"   # GID of the host's docker.socket group; set DOCKER_GID in .env
    environment:
      # wss:// requires TLS termination in front of the backend; ws:// is only
      # allowed to loopback unless allow_insecure_ws is set in agent.yaml.
      UNSWARM_AGENT_BACKEND_URL: ws://backend:5014
      UNSWARM_AGENT_API_KEY: ${UNSWARM_API_KEY:-}

volumes:
  unswarm-data:
